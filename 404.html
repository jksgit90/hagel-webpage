<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sidan hittades inte — Hagel</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="assets/favicon/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="style.css" />
  <style>
    .not-found {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .not-found-code {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(4rem, 18vw, 9rem);
      letter-spacing: 0.04em;
      line-height: 1;
      color: var(--fg);
    }
    .not-found-msg {
      margin-top: 1rem;
      font-size: clamp(1rem, 2vw, 1.15rem);
      color: rgba(242, 243, 244, 0.7);
    }
    .not-found-link {
      margin-top: 2.5rem;
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--fg);
      border-bottom: 1px solid rgba(242, 243, 244, 0.4);
      padding-bottom: 0.3rem;
      transition: opacity 0.2s;
    }
    .not-found-link:hover { opacity: 0.6; }
  </style>
</head>
<body>

<nav>
  <a class="nav-mark" href="/">Hagel</a>
</nav>

<div class="not-found">
  <p class="not-found-code">404</p>
  <p class="not-found-msg">Sidan du letar efter finns inte, kanske regnade den bort.</p>
  <a class="not-found-link" href="/">Tillbaka till startsidan</a>
</div>

</body>
</html>
